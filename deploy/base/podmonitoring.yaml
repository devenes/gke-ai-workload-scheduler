apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: scheduler-controller-monitoring
  namespace: ai-workload-scheduler
  labels:
    app.kubernetes.io/name: gke-ai-workload-scheduler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gke-ai-workload-scheduler
      app.kubernetes.io/component: scheduler-controller
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: runtime-predictor-monitoring
  namespace: ai-workload-scheduler
  labels:
    app.kubernetes.io/name: gke-ai-workload-scheduler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gke-ai-workload-scheduler
      app.kubernetes.io/component: runtime-predictor
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
