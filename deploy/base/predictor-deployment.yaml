apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-predictor
  namespace: ai-workload-scheduler
  labels:
    app.kubernetes.io/name: gke-ai-workload-scheduler
    app.kubernetes.io/component: runtime-predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gke-ai-workload-scheduler
      app.kubernetes.io/component: runtime-predictor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gke-ai-workload-scheduler
        app.kubernetes.io/component: runtime-predictor
    spec:
      serviceAccountName: runtime-predictor-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: predictor
          image: us-west4-docker.pkg.dev/enes-turan-demo/ai-workload-scheduler/predictor:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PREDICTOR_HOST
              value: "0.0.0.0"
            - name: PREDICTOR_PORT
              value: "8081"
            - name: PREDICTOR_ARTIFACT_DIR
              value: "/app/predictor/artifacts"
            - name: PREDICTOR_IMAGE_DIGEST
              value: "sha256:353705e220532916a4430c62d50fce0bf52ceb0380c3ca879243db300b4f0c39"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-predictor
  namespace: ai-workload-scheduler
  labels:
    app.kubernetes.io/name: gke-ai-workload-scheduler
    app.kubernetes.io/component: runtime-predictor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gke-ai-workload-scheduler
    app.kubernetes.io/component: runtime-predictor
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
