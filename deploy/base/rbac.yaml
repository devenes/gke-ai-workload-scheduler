apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler-controller-sa
  namespace: ai-workload-scheduler
  annotations:
    iam.gke.io/gcp-service-account: ai-ws-controller-sa@enes-turan-demo.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/name: gke-ai-workload-scheduler
    app.kubernetes.io/component: controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler-worker-sa
  namespace: ai-workload-scheduler
  labels:
    app.kubernetes.io/name: gke-ai-workload-scheduler
    app.kubernetes.io/component: worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-predictor-sa
  namespace: ai-workload-scheduler
  labels:
    app.kubernetes.io/name: gke-ai-workload-scheduler
    app.kubernetes.io/component: predictor
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scheduler-controller-role
  namespace: ai-workload-scheduler
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scheduler-controller-rolebinding
  namespace: ai-workload-scheduler
subjects:
  - kind: ServiceAccount
    name: scheduler-controller-sa
    namespace: ai-workload-scheduler
roleRef:
  kind: Role
  name: scheduler-controller-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-workload-scheduler-node-viewer
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-workload-scheduler-node-viewer-binding
subjects:
  - kind: ServiceAccount
    name: scheduler-controller-sa
    namespace: ai-workload-scheduler
roleRef:
  kind: ClusterRole
  name: ai-workload-scheduler-node-viewer
  apiGroup: rbac.authorization.k8s.io
