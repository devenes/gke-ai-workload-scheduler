apiVersion: batch/v1
kind: Job
metadata:
  name: predictor-retrain-job
  namespace: ai-workload-scheduler
  labels:
    app.kubernetes.io/name: gke-ai-workload-scheduler
    app.kubernetes.io/component: predictor-retrain
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gke-ai-workload-scheduler
        app.kubernetes.io/component: predictor-retrain
    spec:
      serviceAccountName: runtime-predictor-sa
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: retrain
          image: us-west4-docker.pkg.dev/your-gcp-project-id/ai-workload-scheduler/predictor@sha256:353705e220532916a4430c62d50fce0bf52ceb0380c3ca879243db300b4f0c39
          command: ["python3", "-m", "predictor.train"]
          args:
            - "--artifact-dir=/tmp/artifacts"
            - "--train-seed=202601"
            - "--holdout-seed=202602"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp-artifacts
              mountPath: /tmp
      volumes:
        - name: tmp-artifacts
          emptyDir: {}
